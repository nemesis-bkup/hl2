// Rad-Therapy II configuration file for Marco Cawthorne
unbindall
bind TAB "+showscores"
bind ESCAPE "togglemenu"
bind SPACE "+gostand"
bind CTRL "+duck"
bind MOUSE1 "+attack"
bind MOUSE2 "+attack2"
bind MWHEELDOWN "weapnext"
bind MWHEELUP "weapprev"
bind SHIFT "+sprint"
bind F1 "toggle r_speeds 0 2"
bind F2 "toggle show_fps 0 2"
bind F3 "toggle r_netgraph 0 1"
bind F4 "toggle r_showfields 0 2"
bind F5 "toggle r_showshaders 0 1"
bind F6 "toggle r_wireframe 0 2"
bind F7 "toggle r_showbboxes 0 2"
bind F8 "toggle r_showPhysicsInfo 0 1"
bind F9 "toggle r_showRenderInfo 0 1"
bind ` "toggleconsole"
bind a "+moveleft"
bind d "+moveright"
bind f "+use"
bind n "vote no"
bind p "testLight lights/flashlight"
bind r "+reload"
bind s "+back"
bind t "messagemode"
bind u "messagemode2"
bind v "impulse 100"
bind w "+forward"
bind y "vote yes"
bind z "toggle sv_gamespeed 0.5 1"
set brightness "0"
set con_stayhidden "0"
set con_textfont "fonts/IBMPlexMono-Text.otf?col=1,1,1"
set con_textsize "12"
set con_timestamps "0"
set contrast "1"
set gamma "1"
set gl_conback "gfx/devcon"
set name "^6e^5u^4k^2a^1r^2a"
set r_clear "1"
set r_clearcolour "0.1 0.2 0.231"
set r_shadows "0"
set rate "30000"
set s_al_use_reverb "1"
set s_bits "16"
set s_volume "0.5"
set scr_conalpha "1"
set scr_conspeed "1000"
set scr_fov_mode "4"
set sensitivity "4"
set vid_conautoscale "0"
set vid_conwidth "0"
set vid_conheight "480"
set vid_fullscreen "0"
set vid_height "864"
set vid_renderer "gl"
set vid_vsync "0"
set vid_width "1152"
set g_logLevel "3"
